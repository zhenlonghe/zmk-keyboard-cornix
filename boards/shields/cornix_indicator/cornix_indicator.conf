## use ws2812-spi
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_LED_STRIP=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

## halt recovery: hardware watchdog fed by the indicator work loop
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
