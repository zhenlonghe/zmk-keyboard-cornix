# SPDX-License-Identifier: MIT
#
# Cornix variant of zmk,behavior-soft-off: identical semantics, but flashes
# the status LEDs (white double blink) right before powering off so the user
# gets a visible confirmation that soft off actually happened on each half.

description: Cornix Soft-Off Behavior (with LED confirmation blink)

compatible: "zmk,behavior-cornix-soft-off"

include: zero_param.yaml

properties:
  hold-time-ms:
    type: int
    required: false
    description: Number of milliseconds the behavior must be held before releasing will actually trigger a soft-off.
  split-peripheral-off-on-press:
    type: boolean
    description: When built for a split peripheral, turn off on press, not release
